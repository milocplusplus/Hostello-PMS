<svg xmlns="http://www.w3.org/2000/svg" width="680" height="605" viewBox="0 0 680 605" role="img">
<title>How a Hostello notification reaches someone</title>
<desc>Two writers — an app Server Action and the nightly pg_cron job — both land in one notifications row. A trigger fans it out to one recipient row per person, which feeds the bell, the feed and Realtime. Web push is reachable only from the app path, so cron-written events such as the day-before arrival reminder never push.</desc>
<style>
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif }
  .th { font-size: 14px; font-weight: 500 }
  .ts { font-size: 12px; font-weight: 400 }
  rect { stroke-width: .5 }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none }
  .ahead { stroke: #888780 }
  .app rect  { fill: #EEEDFE; stroke: #534AB7 }
  .app .th   { fill: #3C3489 }
  .app .ts   { fill: #534AB7 }
  .cron rect { fill: #E1F5EE; stroke: #0F6E56 }
  .cron .th  { fill: #085041 }
  .cron .ts  { fill: #0F6E56 }
  .core rect { fill: #F1EFE8; stroke: #5F5E5A }
  .core .th  { fill: #444441 }
  .core .ts  { fill: #5F5E5A }
  .key       { fill: #5F5E5A }
  .sw-app    { fill: #534AB7; stroke: none }
  .sw-cron   { fill: #0F6E56; stroke: none }
  @media (prefers-color-scheme: dark) {
    .arr, .ahead { stroke: #B4B2A9 }
    .app rect  { fill: #3C3489; stroke: #AFA9EC }
    .app .th   { fill: #CECBF6 }
    .app .ts   { fill: #AFA9EC }
    .cron rect { fill: #085041; stroke: #5DCAA5 }
    .cron .th  { fill: #9FE1CB }
    .cron .ts  { fill: #5DCAA5 }
    .core rect { fill: #444441; stroke: #B4B2A9 }
    .core .th  { fill: #D3D1C7 }
    .core .ts  { fill: #B4B2A9 }
    .key       { fill: #B4B2A9 }
    .sw-app    { fill: #AFA9EC }
    .sw-cron   { fill: #5DCAA5 }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ahead" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="app"><rect x="70" y="64" width="220" height="56" rx="4"/><text class="th" x="180" y="88" text-anchor="middle">Server action</text><text class="ts" x="180" y="106" text-anchor="middle">notify.ts helpers</text></g>

<g class="cron"><rect x="390" y="64" width="220" height="56" rx="4"/><text class="th" x="500" y="88" text-anchor="middle">pg_cron job</text><text class="ts" x="500" y="106" text-anchor="middle">daily at 07:00 Karachi</text></g>

<g class="app"><rect x="70" y="150" width="220" height="56" rx="4"/><text class="th" x="180" y="174" text-anchor="middle">emit_notification</text><text class="ts" x="180" y="192" text-anchor="middle">checks caller owns client</text></g>

<line class="arr" x1="180" y1="120" x2="180" y2="150" marker-end="url(#arrow)"/>
<path class="arr" d="M180 206 V221 H240 V236" marker-end="url(#arrow)"/>
<path class="arr" d="M500 120 V221 H440 V236" marker-end="url(#arrow)"/>

<g class="core"><rect x="180" y="236" width="320" height="56" rx="4"/><text class="th" x="340" y="260" text-anchor="middle">notifications</text><text class="ts" x="340" y="278" text-anchor="middle">one row per event</text></g>

<line class="arr" x1="340" y1="292" x2="340" y2="322" marker-end="url(#arrow)"/>

<g class="core"><rect x="180" y="322" width="320" height="56" rx="4"/><text class="th" x="340" y="346" text-anchor="middle">fan_out trigger</text><text class="ts" x="340" y="364" text-anchor="middle">audience decides who</text></g>

<line class="arr" x1="340" y1="378" x2="340" y2="408" marker-end="url(#arrow)"/>

<g class="core"><rect x="180" y="408" width="320" height="56" rx="4"/><text class="th" x="340" y="432" text-anchor="middle">notification_recipients</text><text class="ts" x="340" y="450" text-anchor="middle">one row per person</text></g>

<path class="arr" d="M320 464 V479 H180 V494" marker-end="url(#arrow)"/>
<path class="arr" d="M360 464 V479 H500 V494" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<g class="core"><rect x="70" y="494" width="220" height="56" rx="4"/><text class="th" x="180" y="518" text-anchor="middle">Bell and feed</text><text class="ts" x="180" y="536" text-anchor="middle">realtime, both paths</text></g>

<g class="app"><rect x="390" y="494" width="220" height="56" rx="4"/><text class="th" x="500" y="518" text-anchor="middle">Web push</text><text class="ts" x="500" y="536" text-anchor="middle">app-written events only</text></g>

<rect class="sw-app" x="180" y="572" width="10" height="10" rx="2"/><text class="ts key" x="196" y="581">app-written</text>
<rect class="sw-cron" x="300" y="572" width="10" height="10" rx="2"/><text class="ts key" x="316" y="581">cron-written</text>
</svg>
